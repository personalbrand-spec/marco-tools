<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazit — Gesamtsumme</title>
<style>
  /* ANPASSEN: Zahlen im <script> (playSequence), Akzent --accent, --success */
  :root { --accent:rgba(232,115,90,0.22); --success:rgba(125,224,166,0.28); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;
    background-image:url('https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=1200&q=80');
    background-size:cover; background-position:center; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.32); }
  .stage { position:relative; display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px; width:100%; max-width:480px; }
  .row { flex:1; opacity:0; transform:translateY(16px); transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
    backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%);
    background:rgba(255,255,255,0.13); border:1px solid rgba(255,255,255,0.4); border-radius:20px; padding:14px 16px; }
  .rowwrap { display:flex; gap:14px; width:100%; }
  .rlab { font-size:10px; font-weight:500; letter-spacing:1.2px; color:rgba(255,255,255,0.75); text-transform:uppercase; margin-bottom:4px; }
  .rnum { font-size:30px; font-weight:600; color:#fff; line-height:1; letter-spacing:-1px; text-shadow:0 2px 12px rgba(0,0,0,0.4); }
  .rsub { font-size:12px; color:rgba(255,255,255,0.8); margin-top:5px; }
  .plus { opacity:0; transition:opacity 0.3s ease; font-size:22px; color:rgba(255,255,255,0.9); font-weight:300; margin:-4px 0; }
  .total { opacity:0; transform:scale(0.9); transition:all 0.55s cubic-bezier(0.34,1.56,0.64,1); width:100%;
    backdrop-filter:blur(24px) saturate(150%); -webkit-backdrop-filter:blur(24px) saturate(150%);
    background:var(--accent); border:1.5px solid rgba(255,255,255,0.5); border-radius:26px; padding:22px 26px;
    box-shadow:0 10px 44px rgba(0,0,0,0.4); text-align:center; }
  .tlab { font-size:11px; font-weight:500; letter-spacing:2px; color:rgba(255,255,255,0.9); text-transform:uppercase; }
  .big { font-size:60px; font-weight:600; color:#fff; line-height:1; letter-spacing:-2px; text-shadow:0 3px 18px rgba(0,0,0,0.4); }
  .trow { display:flex; justify-content:center; gap:22px; margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.3); }
  .factor { opacity:0; transform:translateY(14px); transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:var(--success);
    border:1px solid rgba(255,255,255,0.5); border-radius:18px; padding:12px 28px; box-shadow:0 6px 24px rgba(0,0,0,0.3); text-align:center; }
  .playbtn { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); font-family:inherit; font-size:14px; font-weight:500;
    color:#1a1a1a; background:rgba(255,255,255,0.94); border:none; border-radius:12px; padding:11px 26px; cursor:pointer;
    box-shadow:0 4px 18px rgba(0,0,0,0.3); z-index:5; }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="stage">
  <div class="rowwrap">
    <div class="row" id="rowR1">
      <div class="rlab">Restaurant 1 · 5 Pers.</div>
      <div class="rnum">26.362</div>
      <div class="rsub">799 € Wert · 175 € gezahlt</div>
    </div>
    <div class="row" id="rowR2">
      <div class="rlab">Restaurant 2 · 2 Pers.</div>
      <div class="rnum">11.917</div>
      <div class="rsub">401 € Wert · 70 € gezahlt</div>
    </div>
  </div>
  <div class="plus" id="plusSign">+</div>
  <div class="total" id="totalCard">
    <div class="tlab">Beide zusammen</div>
    <div class="big" id="bigNum">0</div>
    <div class="tlab" style="margin-top:4px;">Kalorien</div>
    <div class="trow">
      <div><div class="rlab">Wert</div><div style="font-size:22px; font-weight:600; color:#fff;" id="totEur">0 €</div></div>
      <div><div class="rlab">Gezahlt</div><div style="font-size:22px; font-weight:600; color:#fff;">245 €</div></div>
    </div>
  </div>
  <div class="factor" id="factorCard">
    <span style="font-size:13px; color:rgba(255,255,255,0.9);">Faktor </span>
    <span style="font-size:28px; font-weight:600; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.3);">4,9×</span>
    <div style="font-size:12px; color:rgba(255,255,255,0.85); margin-top:2px;">für jeden Euro fast fünf Euro auf dem Tisch</div>
  </div>
</div>
<button class="playbtn" onclick="playSequence()">▶ Fazit abspielen</button>
<script>
/* ZAHLEN ANPASSEN: die Werte in countTo(...) und im HTML oben (rnum/rsub). */
function ease(t){ return 1-Math.pow(1-t,3); }
function countTo(el, target, dur, suffix){
  const start=performance.now();
  function tick(now){ const p=Math.min((now-start)/dur,1); const v=Math.round(target*ease(p));
    el.textContent=v.toLocaleString('de-DE')+(suffix||''); if(p<1)requestAnimationFrame(tick);
    else el.textContent=target.toLocaleString('de-DE')+(suffix||''); }
  requestAnimationFrame(tick);
}
function resetSeq(){
  ['rowR1','rowR2','plusSign','totalCard','factorCard'].forEach(id=>{ const el=document.getElementById(id);
    el.style.opacity='0'; if(id==='totalCard')el.style.transform='scale(0.9)'; else el.style.transform='translateY(16px)'; });
  document.getElementById('bigNum').textContent='0'; document.getElementById('totEur').textContent='0 €';
}
function playSequence(){
  resetSeq();
  setTimeout(()=>{ const e=document.getElementById('rowR1'); e.style.opacity='1'; e.style.transform='translateY(0)'; },300);
  setTimeout(()=>{ const e=document.getElementById('rowR2'); e.style.opacity='1'; e.style.transform='translateY(0)'; },700);
  setTimeout(()=>{ document.getElementById('plusSign').style.opacity='1'; },1100);
  setTimeout(()=>{ const e=document.getElementById('totalCard'); e.style.opacity='1'; e.style.transform='scale(1)';
    countTo(document.getElementById('bigNum'),38279,1400); countTo(document.getElementById('totEur'),1200,1400,' €'); },1450);
  setTimeout(()=>{ const e=document.getElementById('factorCard'); e.style.opacity='1'; e.style.transform='translateY(0)'; },3100);
}
</script>
</body>
</html>
